name: ${COMPOSE_PROJECT_NAME:-mqlab}

# Hardening shared by all three services (injected with <<: *hardening).
x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILE:-3}

x-labels: &labels
  labels:
    lab.project: mqtt-broker-misconfig
    lab.docs: 02-labs/MQ-labs/Arquitectura Lab.md

services:

  # MQTT broker -- the object of study.
  mosquitto:
    <<: [*hardening, *labels]
    image: eclipse-mosquitto:${MOSQUITTO_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-mqlab}-mosquitto
    hostname: ${MOSQUITTO_HOSTNAME}
    user: "${MOSQ_UID}:${MOSQ_GID}"  
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777     
    networks:
      - lab
    ports:                         
      - "${HOST_BIND_IP}:${MQTT_PORT}:${MQTT_PORT}"
    volumes:
      - type: bind                
        source: ${HOST_CONF_DIR}/active_conf
        target: /mosquitto/config
        read_only: true
      - type: bind               
        source: ${HOST_DATA_DIR}
        target: /mosquitto/data
      - type: bind
        source: ${HOST_LOG_DIR}
        target: /mosquitto/log
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p ${MQTT_PORT}
          -u "${HEALTH_USER}" -P "${HEALTH_PASSWORD}"
          -t '$$SYS/broker/uptime' -C 1 -W ${HEALTH_TIMEOUT} -q 0
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MOSQUITTO_MEM_LIMIT}

  # Home Assistant -- the victim. It consumes the broker, it does not serve it.
  homeassistant:
    <<: [*hardening, *labels]
    init: false
    image: ghcr.io/home-assistant/home-assistant:${HA_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-mqlab}-homeassistant
    hostname: ${HA_HOSTNAME}
    # no user: -- the official image does not support running unprivileged (see notes)
    environment:
      TZ: ${TZ}
    networks:
      - lab
    ports:                      
      - "${HOST_BIND_IP}:${HA_PORT}:${HA_PORT}"
    volumes:
      - type: bind
        source: ${HOST_HA_CONFIG_DIR}
        target: /config
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:${HA_PORT}/manifest.json', timeout=5).status==200 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      mosquitto:
        condition: service_healthy       
    deploy:
      resources:
        limits:
          memory: ${HA_MEM_LIMIT}

  # Fake publisher: a simulated IP camera. Produces the traffic enumeration and detection need to see.
  cam-api:
    <<: [*hardening, *labels]
    build:                              
      context: ./cam-api
      args:
        PYTHON_TAG: ${PYTHON_TAG}
        APP_UID: ${APP_UID}
        APP_GID: ${APP_GID}
    image: ${COMPOSE_PROJECT_NAME:-mqlab}/cam-api:${CAM_API_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-mqlab}-cam-api
    hostname: ${CAM_API_HOSTNAME}
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      MQTT_HOST: ${MQTT_HOST}          
      MQTT_PORT: ${MQTT_PORT}
      MQTT_CLIENT_ID: ${CAM_API_CLIENT_ID}
      MQTT_USERNAME: ${CAM_API_USER}
      MQTT_PASSWORD: ${CAM_API_PASSWORD} 
      TOPIC_PREFIX: ${CAM_API_TOPIC_PREFIX}
      PUBLISH_INTERVAL: ${CAM_API_INTERVAL}
      TZ: ${TZ}
# Line added for labs 02-03
      CAM_RETAIN: ${CAM_RETAIN:-1}
    networks:
      - lab
    depends_on:
      mosquitto:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CAM_API_MEM_LIMIT}

# Dedicated lab network: a Docker bridge. Docker assigns it its own internal subnet
# (172.x) separate from docker0; containers resolve each other by service name.
networks:
  lab:
    name: ${LAB_NETWORK_NAME}
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mqlab 

