# =========================================================================
# Scenario 00 -- OPEN BROKER. No auth, no ACL. Starting state.
# =========================================================================

# --- Listener ---
listener 1883 0.0.0.0          # listen on all interfaces inside the container

# --- Authentication: NONE (this is the flaw being demonstrated) ---
allow_anonymous true           # after v2.0 the default is false.

# Presistence configuration
persistence true
persistence_location /mosquitto/data/    
autosave_interval 60

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log   
log_dest stdout                             
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

